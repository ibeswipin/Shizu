<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Shizu</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%237de2b0'/%3E%3Ctext x='12' y='29' font-size='28' font-family='sans-serif' fill='%23163224'%3Es%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/panel.css">
  <script src="/panel.js" defer></script>
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <div id="boot" class="boot"><span class="brand-mark">s</span><span class="spinner"></span></div>
  <main id="login" class="login" hidden>
    <div class="login-card">
      <div class="brand"><span class="sakura-flower" aria-hidden="true">✿</span><span>Shizu</span></div>
      <h1 data-i18n="login_title"></h1>
      <p class="muted" data-i18n="login_description"></p>
      <div id="login-code" class="login-code" hidden><span data-i18n="verification_code"></span><strong id="code-value"></strong></div>
      <p id="login-status" role="status" aria-live="polite"></p>
      <button id="login-button" class="button primary" data-i18n="login_button"></button>
      <p class="footnote" data-i18n="login_hint"></p>
    </div>
  </main>
  <div id="dashboard" class="shell" hidden>
    <main class="panel-window">
      <header class="panel-header">
        <div class="brand"><span class="sakura-flower" aria-hidden="true">✿</span><span>Shizu</span></div>
      </header>
      <nav class="tabs" aria-label="Shizu">
        <button class="nav active" data-view="settings" data-i18n="settings_title"></button>
        <button class="nav" data-view="modules" data-i18n="modules_title"></button>
        <button class="nav" data-view="logs" data-i18n="logs_title"></button>
        <button class="nav" data-view="backups" data-i18n="backups_title"></button>
      </nav>
      <div class="content">
        <div id="demo-notice" class="demo-notice" hidden data-i18n="demo_notice"></div>
        <section id="view-settings" class="view">
          <form id="settings-form" class="card">
            <div class="field-row"><label for="prefixes"><strong data-i18n="prefixes"></strong><span data-i18n="prefixes_hint"></span></label><input id="prefixes" name="prefixes" required autocomplete="off" maxlength="160"></div>
            <div class="field-row"><label for="language"><strong data-i18n="language"></strong><span data-i18n="language_hint"></span></label><select id="language" name="language"><option value="en">English</option><option value="ru">Русский</option><option value="uz">O‘zbekcha</option></select></div>
            <div class="field-row"><label for="api-protection"><strong data-i18n="api_protection"></strong><span data-i18n="api_protection_hint"></span></label><input class="switch" id="api-protection" name="api_protection" type="checkbox"></div>
            <div class="card-footer"><button class="button primary" type="submit" data-i18n="save_changes"></button></div>
          </form>
        </section>
        <section id="view-modules" class="view" hidden>
          <div class="list-heading"><input id="module-search" type="search" data-i18n-placeholder="search_modules" data-i18n-aria-label="search_modules" autocomplete="off"><button id="refresh-modules" class="text-button" data-i18n="refresh"></button></div>
          <div id="modules-list" class="module-grid"></div><p id="modules-empty" class="muted" hidden data-i18n="no_modules"></p>
          <details class="module-install"><summary data-i18n="install_module"></summary><form id="load-form" class="card load-form"><label for="module-url" data-i18n="module_url"></label><div class="input-action"><input id="module-url" type="url" placeholder="https://…/module.py" required autocomplete="off"><button class="button primary" data-i18n="install_module"></button></div><p class="small muted" data-i18n="besafe_note"></p></form></details>
        </section>
        <section id="view-logs" class="view" hidden>
          <div class="card log-card"><div class="card-heading log-tools"><select id="log-level" data-i18n-aria-label="log_level"><option>DEBUG</option><option selected>INFO</option><option>WARNING</option><option>ERROR</option><option>CRITICAL</option></select><div><button id="download-logs" class="button secondary" data-i18n="download"></button><button id="refresh-logs" class="button secondary" data-i18n="refresh"></button></div></div><pre id="log-output" class="log-output" tabindex="0"></pre><div class="card-footer small muted" data-i18n="logs_hint"></div></div>
        </section>
        <section id="view-backups" class="view" hidden>
          <div class="backup-grid"><div class="card backup-download"><h2 data-i18n="encrypted_backup"></h2><p class="muted" data-i18n="encrypted_backup_hint"></p><button id="download-backup" class="button primary" data-i18n="create_backup"></button></div><div class="card key-card"><h2 data-i18n="recovery_key"></h2><p class="muted" data-i18n="recovery_key_hint"></p><code id="key-path"></code><p class="small muted" data-i18n="key_not_included"></p></div></div>
          <div id="backup-schedule" class="card"><div class="card-heading"><h2 data-i18n="backup_schedule"></h2><span class="small muted" data-i18n="server_time"></span></div><div class="field-row"><label for="auto-backup"><strong data-i18n="daily_backup"></strong><span data-i18n="daily_backup_hint"></span></label><input id="auto-backup" class="switch" type="checkbox"></div><form id="backup-time-form" class="field-row"><label for="backup-time"><strong data-i18n="backup_time"></strong></label><div class="input-action"><input id="backup-time" type="time" required><button class="button secondary" data-i18n="save"></button></div></form></div>
          <form id="restore-form" class="card"><div class="card-heading"><h2 data-i18n="restore_backup"></h2></div><p class="muted" data-i18n="restore_hint"></p><label class="file-input"><span data-i18n="backup_file"></span><input id="restore-file" type="file" accept=".shizu-backup,.json,application/octet-stream,application/json" required></label><label class="check-row"><input id="restore-legacy" type="checkbox"><span data-i18n="allow_legacy"></span></label><button class="button secondary" data-i18n="inspect_backup"></button><div id="restore-preview" class="restore-preview" hidden><strong data-i18n="restore_confirm_title"></strong><p id="restore-summary"></p><p class="muted" data-i18n="restore_confirm_hint"></p><button id="confirm-restore" class="button danger" type="button" data-i18n="confirm_restore"></button></div></form>
        </section>
      </div>
      <footer class="panel-footer">
        <div class="account"><strong id="account-name"></strong><small id="account-id"></small></div>
        <button id="logout" class="text-button" data-i18n="logout"></button>
      </footer>
      <p class="session-note" data-i18n="session_note"></p>
    </main>
  </div>
  <dialog id="config-dialog"><div class="dialog-heading"><div><span class="eyebrow" data-i18n="module_configuration"></span><h2 id="config-title"></h2></div><button id="close-config" class="icon-button" data-i18n-title="close" data-i18n-aria-label="close">×</button></div><p class="muted small" data-i18n="hidden_values_hint"></p><div id="config-fields"></div></dialog>
  <div id="toast" class="toast" hidden role="status" aria-live="polite"></div>
</body>
</html>
